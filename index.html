<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Folio CV Builder</title>
  <meta name="description" content="Build a professional CV in minutes: pick a template, fill in your details and download it as a PDF.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='3' fill='%232F49D1'/%3E%3Crect x='9' y='8' width='14' height='3' rx='1' fill='%23fff'/%3E%3Crect x='9' y='14' width='10' height='2' rx='1' fill='%23fff' opacity='.8'/%3E%3Crect x='9' y='19' width='12' height='2' rx='1' fill='%23fff' opacity='.8'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/app.css">
  <link id="cv-styles" rel="stylesheet" href="css/templates.css">
</head>
<body>
  <div class="app" id="app" data-view="edit">
    <header class="bar">
      <div class="brand"><b>Folio</b><span>CV builder</span></div>
      <div class="switch" role="group" aria-label="View">
        <button type="button" id="viewEdit" aria-pressed="true">Edit</button>
        <button type="button" id="viewPreview" aria-pressed="false">Preview</button>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="saveJson" title="Save your details to a file you can load later">Save data</button>
        <button type="button" class="btn ghost" id="loadJson" title="Load details saved earlier">Load data</button>
        <input type="file" id="jsonFile" accept=".json,application/json" hidden>
        <button type="button" class="btn" id="dlHtml">Download HTML</button>
        <button type="button" class="btn" id="printPdf" title="Opens your browser's print dialog. Choose 'Save as PDF' for a PDF with selectable text.">Print</button>
        <button type="button" class="btn primary" id="dlPdf">Download PDF</button>
      </div>
    </header>

    <div class="split">
      <section class="editor" id="editor" aria-label="CV details">
        <div class="editor-inner" id="editorInner"></div>
      </section>
      <section class="preview" id="previewPane" aria-label="CV preview">
        <div class="preview-inner">
          <div class="preview-meta" id="previewMeta"></div>
          <div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
        </div>
      </section>
    </div>
  </div>

  <!-- Holds the CV while the browser's print dialog is open -->
  <div id="printHost" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- PDF export libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

  <script src="js/templates.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
