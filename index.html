<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Folio CV Builder</title>
  <meta name="description" content="Build a professional CV in minutes: pick a template, fill in your details and download it as a PDF.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='2' width='22' height='28' rx='3' fill='%232F49D1'/%3E%3Crect x='9' y='8' width='14' height='3' rx='1' fill='%23fff'/%3E%3Crect x='9' y='14' width='10' height='2' rx='1' fill='%23fff' opacity='.8'/%3E%3Crect x='9' y='19' width='12' height='2' rx='1' fill='%23fff' opacity='.8'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="font-link" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/app.css">
  <link id="cv-styles" rel="stylesheet" href="css/templates.css">
</head>
<body>
  <div class="app-root">

    <!-- ===================== My CVs (library) ===================== -->
    <section class="view library" id="libraryView" hidden>
      <header class="bar">
        <div class="brand"><b>Folio</b><span>CV builder</span></div>
        <div class="actions">
          <button type="button" class="btn ghost" id="importJson" title="Add a CV from a .json data file saved earlier">Import data file</button>
          <button type="button" class="btn primary" data-act="new">+ Create new</button>
        </div>
      </header>
      <main class="lib-main">
        <div class="lib-head">
          <h1>My CVs</h1>
          <p id="libCount"></p>
        </div>
        <div class="cv-grid" id="cvGrid"></div>
        <p class="lib-foot">Your CVs are saved in this browser only. To move them to another device, open a CV and choose Download → Data file, then import it there.</p>
      </main>
    </section>

    <!-- ===================== Editor ===================== -->
    <section class="view app" id="editorView" data-view="edit" hidden>
      <header class="bar">
        <a class="btn ghost back" href="#/" title="Back to My CVs">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
          <span>My CVs</span>
        </a>
        <input class="title-input" id="cvTitle" type="text" aria-label="CV name" placeholder="Untitled CV" autocomplete="off">
        <span class="save-status" id="saveStatus" role="status" aria-live="polite"></span>
        <div class="switch" role="group" aria-label="View">
          <button type="button" id="viewEdit" aria-pressed="true">Edit</button>
          <button type="button" id="viewPreview" aria-pressed="false">Preview</button>
        </div>
        <div class="actions">
          <details class="menu">
            <summary class="btn">Download</summary>
            <div class="menu-list" role="menu">
              <button type="button" role="menuitem" data-export="pdf"><b>PDF</b><small>One-click download</small></button>
              <button type="button" role="menuitem" data-export="print"><b>Print / Save as PDF</b><small>Selectable text, best for job sites</small></button>
              <button type="button" role="menuitem" data-export="html"><b>HTML page</b><small>A standalone web copy</small></button>
              <button type="button" role="menuitem" data-export="json"><b>Data file (.json)</b><small>Backup you can import later</small></button>
            </div>
          </details>
          <button type="button" class="btn primary" id="saveBtn">Save</button>
        </div>
      </header>

      <div class="split">
        <section class="editor" id="editor" aria-label="CV details">
          <div class="editor-inner" id="editorInner"></div>
        </section>
        <section class="preview" id="previewPane" aria-label="CV preview">
          <div class="preview-inner">
            <div class="preview-meta" id="previewMeta"></div>
            <div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
          </div>
        </section>
      </div>
    </section>

    <!-- ===================== Viewer ===================== -->
    <section class="view viewer" id="viewerView" hidden>
      <header class="bar">
        <a class="btn ghost back" href="#/" title="Back to My CVs">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
          <span>My CVs</span>
        </a>
        <h1 class="viewer-title" id="viewerTitle"></h1>
        <div class="actions">
          <button type="button" class="btn ghost danger" data-act="delete-current">Delete</button>
          <button type="button" class="btn" data-act="dup-current">Duplicate</button>
          <details class="menu">
            <summary class="btn">Download</summary>
            <div class="menu-list" role="menu">
              <button type="button" role="menuitem" data-export="pdf"><b>PDF</b><small>One-click download</small></button>
              <button type="button" role="menuitem" data-export="print"><b>Print / Save as PDF</b><small>Selectable text, best for job sites</small></button>
              <button type="button" role="menuitem" data-export="html"><b>HTML page</b><small>A standalone web copy</small></button>
              <button type="button" role="menuitem" data-export="json"><b>Data file (.json)</b><small>Backup you can import later</small></button>
            </div>
          </details>
          <a class="btn primary" id="viewerEdit" href="#/">Edit</a>
        </div>
      </header>
      <div class="viewer-pane" id="viewerPane">
        <div class="preview-inner">
          <div class="preview-meta" id="viewerMeta"></div>
          <div class="sheet-wrap" id="viewerWrap"><div class="sheet" id="viewerSheet"></div></div>
        </div>
      </div>
    </section>
  </div>

  <!-- ===================== Create new dialog ===================== -->
  <dialog id="newDialog" aria-labelledby="newTitle">
    <form method="dialog" id="newForm">
      <div class="dlg-head">
        <h2 id="newTitle">Create a new CV</h2>
        <button type="button" class="icon-btn" data-act="close-dialog" aria-label="Close">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <div class="dlg-body">
        <div class="field">
          <label for="newName">CV name</label>
          <input type="text" id="newName" placeholder="e.g. Product Designer – Brightpay application" autocomplete="off">
          <span class="help">Only you see this. It helps you tell your CVs apart.</span>
        </div>
        <div class="field">
          <span class="label">Template</span>
          <div class="tpls" id="newTpls" role="radiogroup" aria-label="Template"></div>
        </div>
        <div class="field">
          <span class="label">Start with</span>
          <div class="choices">
            <label class="choice"><input type="radio" name="newStart" value="blank" checked><span><b>Blank form</b><small>Fill in your own details</small></span></label>
            <label class="choice"><input type="radio" name="newStart" value="example"><span><b>Example content</b><small>Edit a filled-in sample</small></span></label>
            <label class="choice" id="copyChoice" hidden><input type="radio" name="newStart" value="copy"><span><b>Copy of my latest CV</b><small id="copyChoiceName"></small></span></label>
          </div>
        </div>
      </div>
      <div class="dlg-foot">
        <button type="button" class="btn ghost" data-act="close-dialog">Cancel</button>
        <button type="submit" class="btn primary">Create CV</button>
      </div>
    </form>
  </dialog>

  <!-- ===================== Confirm dialog ===================== -->
  <dialog id="confirmDialog" class="small" aria-labelledby="confirmTitle">
    <form method="dialog">
      <div class="dlg-body">
        <h2 id="confirmTitle"></h2>
        <p id="confirmMsg"></p>
      </div>
      <div class="dlg-foot">
        <button type="submit" class="btn ghost" value="cancel">Cancel</button>
        <button type="submit" class="btn danger-solid" value="ok" id="confirmOk">Delete</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="jsonFile" accept=".json,application/json" hidden>
  <!-- Holds the CV while the browser's print dialog is open -->
  <div id="printHost" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- PDF export libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>

  <script src="js/templates.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/export.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
